[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fixedincome"
version = "0.1.0"
description = "Bond pricing, risk measures and yield curve construction in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yehia Dawoud" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
